plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        fiximizer {
            sourceSet(sourceSets.main)
        }
    }
}

// ModDevGradle creates its legacy run classpath while configuring the
// NeoForge runs above, so keep additionalRuntimeClasspath declarations below
// the neoForge block. Jar-in-Jar packages the libraries in the published mod.
dependencies {
    jarJar(implementation('com.github.oshi:oshi-core:7.7.3')) {
        version {
            strictly '[7.7.3,7.7.4)'
            prefer '7.7.3'
        }
    }

    jarJar(implementation('org.lwjgl:lwjgl-opencl:3.3.3')) {
        version {
            strictly '[3.3.3]'
            prefer '3.3.3'
        }
    }

    additionalRuntimeClasspath 'com.github.oshi:oshi-core:7.7.3'
    additionalRuntimeClasspath 'org.lwjgl:lwjgl-opencl:3.3.3'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
