plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        fiximizer {
            sourceSet(sourceSets.main)
        }
    }
}

// ModDevGradle creates the legacy run classpath while configuring the
// NeoForge runs above, so keep additionalRuntimeClasspath declarations below
// the neoForge block. Jar-in-Jar packages each required runtime library.
dependencies {
    // NeoForge supplies Mixin at runtime; compile against its API and run the AP only.
    compileOnly 'org.spongepowered:mixin:0.8.5'
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // Minecraft 1.21.1 already provides OSHI 6.4.10 and JNA 5.14.0.
    // Compile against the game-provided OSHI API rather than embedding another
    // com.github.oshi module, which breaks ModLauncher module resolution.
    compileOnly('com.github.oshi:oshi-core:6.4.10') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }

    // OpenCL is not part of Minecraft's standard LWJGL bundle.
    jarJar(implementation('org.lwjgl:lwjgl-opencl:3.3.3')) {
        version {
            strictly '[3.3.3]'
            prefer '3.3.3'
        }
    }

    additionalRuntimeClasspath 'org.lwjgl:lwjgl-opencl:3.3.3'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_version            : project.mod_version,
            mod_license            : project.mod_license,
            mod_authors             : project.mod_authors,
            mod_homepage            : project.mod_homepage,
            mod_issue_tracker       : project.mod_issue_tracker,
            mod_download_url        : project.mod_download_url,
            mod_update_json         : project.mod_update_json,
            mod_credits             : project.mod_credits,
            minecraft_version_range: project.minecraft_version_range,
            neo_version_range      : project.neo_version_range
    ]

    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
