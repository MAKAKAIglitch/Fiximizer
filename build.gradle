plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = project.mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        fiximizer {
            sourceSet(sourceSets.main)
        }
    }
}

// ModDevGradle creates the legacy run classpath while configuring the
// NeoForge runs above, so keep additionalRuntimeClasspath declarations below
// the neoForge block. Jar-in-Jar packages each required runtime library.
dependencies {
    // OSHI 6.11.1 keeps the GPU telemetry API in one artifact.
    // OSHI 6.12+ splits common/core into named modules that conflict in
    // NeoForge's module layer because both export oshi.software.common.
    jarJar(implementation('com.github.oshi:oshi-core:6.11.1') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }) {
        version {
            strictly '[6.11.1]'
            prefer '6.11.1'
        }
    }

    // Match OSHI 6.11.x's JNA artifact coordinates while keeping the
    // already selected, newer JNA runtime version.
    jarJar(implementation('net.java.dev.jna:jna:5.19.1')) {
        version {
            strictly '[5.19.1]'
            prefer '5.19.1'
        }
    }

    jarJar(implementation('net.java.dev.jna:jna-platform:5.19.1')) {
        version {
            strictly '[5.19.1]'
            prefer '5.19.1'
        }
    }

    jarJar(implementation('org.lwjgl:lwjgl-opencl:3.3.3')) {
        version {
            strictly '[3.3.3]'
            prefer '3.3.3'
        }
    }

    additionalRuntimeClasspath('com.github.oshi:oshi-core:6.11.1') {
        exclude group: 'org.slf4j', module: 'slf4j-api'
    }
    additionalRuntimeClasspath 'org.lwjgl:lwjgl-opencl:3.3.3'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            mod_id                 : project.mod_id,
            mod_name               : project.mod_name,
            mod_version            : project.mod_version,
            mod_license            : project.mod_license,
            minecraft_version_range: project.minecraft_version_range,
            neo_version_range      : project.neo_version_range
    ]

    inputs.properties replaceProperties
    filesMatching('META-INF/neoforge.mods.toml') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
