# Gradle
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.java.installations.auto-download=true

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
# Build against the minimum supported NeoForge for Minecraft 1.21.1.
neo_version=21.1.256
# Accept compatible releases from 21.1.256 up to (but not including) the next MC line.
neo_version_range=[21.1.256,21.2)

# Mod metadata
mod_id=fiximizer
mod_name=Fiximizer
mod_version=0.14.0-alpha
mod_license=MIT
mod_group_id=com.makakaiglitch.fiximizer

# Public project metadata
mod_authors=MAKAKAIglitch
mod_homepage=https://github.com/MAKAKAIglitch/Fiximizer
mod_issue_tracker=https://github.com/MAKAKAIglitch/Fiximizer/issues
mod_download_url=https://github.com/MAKAKAIglitch/Fiximizer/releases
mod_update_json=https://raw.githubusercontent.com/MAKAKAIglitch/Fiximizer/main/update.json
mod_credits=Open-source project built with NeoForge, OSHI and LWJGL; thanks to their maintainers and the Minecraft modding community.
