name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  compatibility-matrix:
    name: NeoForge compatibility (${{ matrix.neo-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neo-version: ['21.1.256', '21.1.265']
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test against selected NeoForge
        run: ./gradlew build --no-daemon -Pneo_version=${{ matrix.neo-version }}

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build mod
        run: ./gradlew build --no-daemon

      - name: Upload Linux build
        uses: actions/upload-artifact@v7
        with:
          name: Fiximizer-0.14.0-alpha-linux
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Validate PowerShell builder syntax
        shell: powershell
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD\scripts\build.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List
            exit 1
          }

      - name: Run automatic Fiximizer builder
        shell: powershell
        run: .\scripts\build.ps1 build --no-daemon

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: Fiximizer-0.14.0-alpha-windows
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
